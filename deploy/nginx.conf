server {
    listen 80;
    server_name w3os.auditware.io www.w3os.auditware.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name w3os.auditware.io www.w3os.auditware.io;

    ssl_certificate     /etc/letsencrypt/live/w3os.auditware.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/w3os.auditware.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Backend API + OG images
    location /api/ {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache OG images at nginx level
        location /api/og/ {
            proxy_pass       http://localhost:3001;
            proxy_cache_valid 200 1d;
            add_header       Cache-Control "public, max-age=86400";
        }
    }

    # Next.js static assets served directly
    location /_next/static/ {
        alias /var/www/w3os/frontend/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /public/ {
        alias /var/www/w3os/frontend/.next/standalone/public/;
    }

    # Next.js frontend
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
