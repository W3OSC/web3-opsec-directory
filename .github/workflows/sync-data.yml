name: Sync company data to production

on:
  push:
    branches: [main]
    paths:
      - "data/companies/**"
      - "data/tools/**"
      - "data/company.schema.json"
      - "data/tool.schema.json"

jobs:
  sync:
    name: Sync data - server - reload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Git Secret Reveal
        uses: entrostat/git-secret-action@v4
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

      - name: Validate company data
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install && bun run validate

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Load deploy config
        run: |
          set -a && source ./deploy.env && set +a
          echo "$GCP_SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          echo "GCP_PROJECT=$GCP_PROJECT"   >> $GITHUB_ENV
          echo "GCP_ZONE=$GCP_ZONE"         >> $GITHUB_ENV
          echo "GCP_INSTANCE=$GCP_INSTANCE" >> $GITHUB_ENV
          echo "GCP_USER=$GCP_USER"         >> $GITHUB_ENV

      - name: Open IAP tunnel
        run: |
          gcloud compute start-iap-tunnel "$GCP_INSTANCE" 22 \
            --local-host-port=localhost:2222 \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT" &
          echo $! > /tmp/iap_tunnel.pid
          timeout 30 bash -c 'until nc -z localhost 2222; do sleep 1; done'

      - name: Rsync data/ to server
        env:
          SSH_OPTS: "-i /tmp/deploy_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          rsync -Pazv -e "ssh $SSH_OPTS" \
            data/companies/ ${GCP_USER}@localhost:/var/www/w3os/data/companies/
          rsync -Pazv -e "ssh $SSH_OPTS" \
            data/tools/ ${GCP_USER}@localhost:/var/www/w3os/data/tools/

      - name: Reload backend (re-seeds DB from new JSON)
        env:
          SSH_OPTS: "-i /tmp/deploy_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ssh $SSH_OPTS ${GCP_USER}@localhost "export PATH=\"/home/${GCP_USER}/.bun/bin:/usr/local/bin:\$PATH\" && pm2 reload w3os-backend --update-env"

      - name: Health check
        env:
          SSH_OPTS: "-i /tmp/deploy_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          sleep 3
          ssh $SSH_OPTS ${GCP_USER}@localhost "curl -sf http://localhost:3001/health"

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/deploy_key
          [ -f /tmp/iap_tunnel.pid ] && kill $(cat /tmp/iap_tunnel.pid) 2>/dev/null || true
          rm -f /tmp/iap_tunnel.pid
