name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/companies/**"
      - "data/tools/**"
      - "data/company.schema.json"
      - "data/tool.schema.json"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Reveal secrets
        uses: entrostat/git-secret-action@v4
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

      - name: Load deploy config
        run: |
          set -a && source ./deploy.env && set +a
          echo "$GCP_SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          echo "GCP_PROJECT=$GCP_PROJECT"   >> $GITHUB_ENV
          echo "GCP_ZONE=$GCP_ZONE"         >> $GITHUB_ENV
          echo "GCP_INSTANCE=$GCP_INSTANCE" >> $GITHUB_ENV
          echo "GCP_USER=$GCP_USER"         >> $GITHUB_ENV

      - name: Prepare frontend build env
        run: cp secrets/.env.frontend.prod frontend/.env.production

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Open IAP tunnel
        run: |
          gcloud compute start-iap-tunnel "$GCP_INSTANCE" 22 \
            --local-host-port=localhost:2222 \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT" &
          echo $! > /tmp/iap_tunnel.pid
          timeout 30 bash -c 'until nc -z localhost 2222; do sleep 1; done'

      - name: Ensure rsync on server
        env:
          SSH_OPTS: "-i /tmp/deploy_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ssh $SSH_OPTS ${GCP_USER}@localhost \
            "command -v rsync >/dev/null || sudo apt-get install -y rsync"

      - name: Rsync app to server
        env:
          SSH_OPTS: "-i /tmp/deploy_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          TARGET: "${{ env.GCP_USER }}@localhost"
        run: |
          rsync -Pazv --delete-delay -e "ssh $SSH_OPTS" \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='backend/data/' \
            --exclude='backend/assets/*.ttf' \
            --exclude='secrets/' \
            ./ ${TARGET}:/var/www/w3os/

          rsync -Pazv -e "ssh $SSH_OPTS" \
            frontend/.next/standalone/ ${TARGET}:/var/www/w3os/frontend/.next/standalone/

          rsync -Pazv -e "ssh $SSH_OPTS" \
            frontend/.next/static/ ${TARGET}:/var/www/w3os/frontend/.next/standalone/.next/static/

          rsync -Pazv -e "ssh $SSH_OPTS" \
            frontend/public/ ${TARGET}:/var/www/w3os/frontend/.next/standalone/public/

          ssh $SSH_OPTS ${TARGET} "mkdir -p /var/www/w3os/secrets"
          rsync -Pzv -e "ssh $SSH_OPTS" secrets/.env.backend.prod ${TARGET}:/var/www/w3os/secrets/
          rsync -Pzv -e "ssh $SSH_OPTS" secrets/.env.frontend.prod ${TARGET}:/var/www/w3os/secrets/

      - name: Install backend dependencies on server
        env:
          SSH_OPTS: "-i /tmp/deploy_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ssh $SSH_OPTS ${GCP_USER}@localhost \
            "cd /var/www/w3os/backend && bun install --production"

      - name: Restart services
        env:
          SSH_OPTS: "-i /tmp/deploy_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ssh $SSH_OPTS ${GCP_USER}@localhost \
            "cd /var/www/w3os && pm2 reload ecosystem.prod.config.js --update-env || pm2 start ecosystem.prod.config.js"

      - name: Health check
        env:
          SSH_OPTS: "-i /tmp/deploy_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          sleep 5
          HEALTH=$(ssh $SSH_OPTS ${GCP_USER}@localhost \
            "curl -sf http://localhost:3001/health || echo FAILED")
          if [ "$HEALTH" = "ok" ]; then
            echo "Backend healthy"
          else
            ssh $SSH_OPTS ${GCP_USER}@localhost \
              "pm2 --nostream logs w3os-backend --lines 30 --err"
            exit 1
          fi

      - name: Deploy nginx config
        env:
          SSH_OPTS: "-i /tmp/deploy_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          rsync -Pzv -e "ssh $SSH_OPTS" \
            deploy/nginx.conf ${GCP_USER}@localhost:/tmp/w3os-nginx.conf
          ssh $SSH_OPTS ${GCP_USER}@localhost \
            "sudo mv /tmp/w3os-nginx.conf /etc/nginx/sites-available/w3os && \
             sudo ln -sf /etc/nginx/sites-available/w3os /etc/nginx/sites-enabled/w3os && \
             sudo nginx -t && \
             sudo systemctl reload nginx"

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/deploy_key
          [ -f /tmp/iap_tunnel.pid ] && kill $(cat /tmp/iap_tunnel.pid) 2>/dev/null || true
          rm -f /tmp/iap_tunnel.pid
